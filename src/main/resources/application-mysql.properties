# ===================================================================
# GarageDesk MySQL Profile Configuration
# Activate by running: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or setting: spring.profiles.active=mysql in application.properties
# ===================================================================

spring.datasource.url=jdbc:mysql://localhost:3305/garagedesk_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mbmt7813
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
