# ===================================================================
# GarageDesk Application Configuration
# Sri Eshwar College of Engineering - Question 67
# ===================================================================

spring.application.name=garagedesk
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (Default: H2 In-Memory with persistence option)
# Zero external setup required for instant evaluation and testing!
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:garagedeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Web Console Configuration (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Optional MySQL Configuration (Uncomment below to run with MySQL)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/garagedesk_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# Swagger / OpenAPI Configuration
# Access Swagger UI at http://localhost:8080/swagger-ui/index.html or http://localhost:8080/swagger-ui.html
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Standard JSON response formatting
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
